; Vintage theme for Spotify (#53). Every slot is a Frame role from
; docs/theme-spec.md; the mapping is the Spotify row there and
; spicetify/tests/vintage_test.mjs.

[Vintage]
text               = 000000 ; frame_text
subtext            = 808080 ; frame_gray_text
main               = C0C0C0 ; frame_face
main-elevated      = C0C0C0 ; frame_face
highlight          = C0C0C0 ; frame_face (no hover highlight)
highlight-elevated = C0C0C0 ; frame_face (no hover highlight)
sidebar            = C0C0C0 ; frame_face
player             = C0C0C0 ; frame_face
card               = C0C0C0 ; frame_face
shadow             = 808080 ; frame_shadow
selected-row       = 000080 ; frame_selection
button             = 000080 ; frame_selection (was Spotify green)
button-active      = 000080 ; frame_selection (was Spotify green)
button-disabled    = E0E0E0 ; frame_light
tab-active         = E0E0E0 ; frame_light
notification       = C0C0C0 ; frame_face
notification-error = 800000 ; frame_data_red
misc               = 808080 ; frame_gray_text
