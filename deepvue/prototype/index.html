<!doctype html>
<!--
  PROTOTYPE, throw me away. Lives only on the prototype/deepvue-chart branch.
  Run: python3 -m http.server -d ~/.config 8765, then open
  http://localhost:8765/deepvue/prototype/index.html?variant=stock
  Question: does the Vintage theme's light Work surface read well as a Deepvue chart,
  and is wrapping it in the full Vintage Frame worth a whole-app stylesheet later?
  Two variants via ?variant=: "stock" (chart colors in Deepvue's own light UI, what
  you get from chart settings alone) and "frame" (the later whole-app stage).
  Chart colors are identical in both; only the surroundings change.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE: Deepvue in the Vintage theme</title>
<style>
  @font-face { font-family: "Fixedsys Excelsior"; src: url("../../fonts/FSEX302.ttf"); }

  :root {
    /* Frame palette */
    --frame_face: #C0C0C0; --frame_highlight: #FFFFFF; --frame_light: #E0E0E0;
    --frame_shadow: #808080; --frame_dark_shadow: #000000;
    --frame_title: #000080; --frame_title_text: #FFFFFF;
    --frame_text: #000000; --frame_gray_text: #808080; --frame_window: #FFFFFF;
    --frame_selection: #000080; --frame_selection_text: #FFFFFF;
    --frame_desktop: #008080;
    --frame_data_red: #800000; --frame_data_green: #008000;
    /* Work surface palette */
    --work_bg: #FFFFFF; --work_fg: #000080; --work_grid: #C0C0C0; --work_line_number: #808080;
    --raised: inset -1px -1px var(--frame_dark_shadow), inset 1px 1px var(--frame_highlight),
              inset -2px -2px var(--frame_shadow), inset 2px 2px var(--frame_light);
    --sunken: inset -1px -1px var(--frame_highlight), inset 1px 1px var(--frame_shadow),
              inset -2px -2px var(--frame_light), inset 2px 2px var(--frame_dark_shadow);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; }
  .app { flex: 1; display: grid; grid-template-columns: 200px 1fr 380px; grid-template-rows: auto 1fr; min-height: 0; }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 10px; height: 36px; }
  .watchlist, .side { overflow: auto; min-height: 0; }
  .chart-wrap { position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 3px 5px; text-align: left; white-space: nowrap; }
  td.num { text-align: right; }
  .swatch { display: inline-block; width: 12px; height: 12px; vertical-align: middle; border: 1px solid #000; }
  .up { color: var(--frame_data_green); } .down { color: var(--frame_data_red); }

  /* ---- variant: stock (approximation of Deepvue's own light UI; not spec roles) ---- */
  body.stock { font: 13px -apple-system, "Inter", "Helvetica Neue", sans-serif; color: #1f2937; background: #f3f4f6; }
  .stock .topbar { background: #fff; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
  .stock .topbar .sym { font-size: 15px; }
  .stock .topbar .pill { background: #eff6ff; color: #2563eb; border-radius: 6px; padding: 3px 8px; font-weight: 500; }
  .stock .watchlist, .stock .side { background: #fff; border-right: 1px solid #e5e7eb; }
  .stock .side { border-right: 0; border-left: 1px solid #e5e7eb; }
  .stock h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin: 12px 10px 6px; }
  .stock tr.sel { background: #eff6ff; }
  .stock tr:hover { background: #f9fafb; }
  .stock .box { margin: 8px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
  .stock .chart-wrap { margin: 8px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }

  /* ---- variant: frame (full Vintage Frame, per docs/web-theme.md) ---- */
  body.frame { font: 14px "Microsoft Sans Serif", Tahoma, sans-serif; color: var(--frame_text); background: var(--frame_face); }
  .frame .titlebar { display: flex; align-items: center; height: 22px; padding: 0 4px; background: var(--frame_title); color: var(--frame_title_text); font: bold 13px Tahoma, sans-serif; }
  .frame .topbar { background: var(--frame_face); }
  .frame .topbar .sym { font: bold 14px Tahoma, sans-serif; }
  .frame .topbar .pill { background: var(--frame_face); box-shadow: var(--raised); padding: 3px 10px; }
  .frame .watchlist, .frame .side { margin: 4px; background: var(--frame_window); box-shadow: var(--sunken); padding: 2px; }
  .frame .side { background: var(--frame_face); box-shadow: none; padding: 0; }
  .frame h3 { font: bold 13px Tahoma, sans-serif; margin: 8px 6px 4px; }
  .frame tr.sel, .frame .watchlist tr:hover { background: var(--frame_selection); color: var(--frame_selection_text); }
  .frame tr.sel .up, .frame tr.sel .down, .frame .watchlist tr:hover td { color: var(--frame_selection_text); }
  .frame .box { margin: 4px; background: var(--frame_window); box-shadow: var(--sunken); padding: 2px; }
  .frame .box.mono { font: 16px/16px "Fixedsys Excelsior", Menlo, monospace; font-variant-ligatures: none; font-synthesis: none; color: var(--work_fg); }
  .frame .chart-wrap { margin: 4px; box-shadow: var(--sunken); }
  .frame .chart-wrap canvas { inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); }
  body:not(.frame) .titlebar { display: none; }

  /* ---- prototype switcher (not part of the design) ---- */
  .switcher { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
    background: #111; color: #fff; font: 13px -apple-system, sans-serif; padding: 6px 10px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.4); z-index: 9; }
  .switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 26px; height: 26px; cursor: pointer; }
</style>
</head>
<body>
<div class="titlebar">Deepvue - NVDA</div>
<div class="app">
  <div class="topbar"><span class="sym">NVDA</span><span>NVIDIA Corp</span><span class="pill">D</span><span class="pill">W</span><span class="pill">Indicators</span></div>
  <div class="watchlist"><h3>Watchlist</h3><table id="wl"></table></div>
  <div class="chart-wrap"><canvas id="c"></canvas></div>
  <div class="side">
    <h3>Data</h3><div class="box mono"><table id="data"></table></div>
    <h3>Deepvue chart settings</h3><div class="box"><table id="pal"></table></div>
  </div>
</div>
<div class="switcher"><button id="prev">&larr;</button><span id="label"></span><button id="next">&rarr;</button></div>

<script>
// Chart palette: the thing being judged. Role names from docs/theme-spec.md.
const P = [
  ["Background",        "#FFFFFF", "work_bg"],
  ["Grid lines",        "#C0C0C0", "work_grid"],
  ["Scale text",        "#808080", "work_line_number"],
  ["Candle up (all parts)",   "#008000", "frame_data_green"],
  ["Candle down (all parts)", "#800000", "frame_data_red"],
  ["Volume up",         "#008000", "frame_data_green"],
  ["Volume down",       "#800000", "frame_data_red"],
  ["EMA 10",            "#000080", "work_fg / ansi_4"],
  ["EMA 21",            "#008080", "syntax_function / ansi_6"],
  ["SMA 50",            "#800080", "syntax_number / ansi_5"],
  ["SMA 200",           "#000000", "ansi_0"],
  ["RS line",           "#804000", "syntax_constant"],
  ["Crosshair",         "#808080", "work_line_number"],
  ["Hover band",        "#FFFFE1", "work_cursorline"],
];
const C = Object.fromEntries(P.map(([k, v]) => [k, v]));
const UP = C["Candle up (all parts)"], DOWN = C["Candle down (all parts)"];
const MAS = [["EMA 10", 10, "ema"], ["EMA 21", 21, "ema"], ["SMA 50", 50, "sma"], ["SMA 200", 200, "sma"]];

// Seeded fake data: deterministic random walk, so every reload looks the same.
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const r = rng(42), N = 420, SHOW = 150;
let px = 60, bench = 100; const bars = [];
for (let i = 0; i < N; i++) {
  const drift = i > 300 ? 0.004 : 0.0012;
  const o = px, c = o * (1 + drift + (r() - 0.5) * 0.045);
  const h = Math.max(o, c) * (1 + r() * 0.018), l = Math.min(o, c) * (1 - r() * 0.018);
  bench *= 1 + 0.0005 + (r() - 0.5) * 0.02;
  bars.push({ o, h, l, c, v: (0.6 + r()) * (1 + Math.abs(c - o) / o * 25) * 1e6, rs: c / bench });
  px = c;
}
for (const [name, n, kind] of MAS) {
  let e;
  bars.forEach((b, i) => {
    if (kind === "ema") { e = e === undefined ? b.c : b.c * 2 / (n + 1) + e * (1 - 2 / (n + 1)); b[name] = i >= n ? e : null; }
    else b[name] = i >= n - 1 ? bars.slice(i - n + 1, i + 1).reduce((s, x) => s + x.c, 0) / n : null;
  });
}
const view = bars.slice(N - SHOW);

// Chart drawing
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let hover = SHOW - 1;
function draw() {
  const dpr = devicePixelRatio, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const axisW = 60, plotW = W - axisW, priceH = H * 0.74, volTop = priceH + 8, volH = H - volTop - 20;
  const bw = plotW / SHOW, X = i => i * bw + bw / 2;
  const hi = Math.max(...view.map(b => b.h)), lo = Math.min(...view.map(b => Math.min(b.l, b["SMA 200"] ?? b.l)));
  const pad = (hi - lo) * 0.05, Y = p => 8 + (1 - (p - lo + pad) / (hi - lo + 2 * pad)) * (priceH - 16);
  const vmax = Math.max(...view.map(b => b.v)), VY = v => volTop + volH - v / vmax * volH;
  const rsMin = Math.min(...view.map(b => b.rs)), rsMax = Math.max(...view.map(b => b.rs));
  const RY = v => priceH - 10 - (v - rsMin) / (rsMax - rsMin) * priceH * 0.2;

  ctx.fillStyle = C["Background"]; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C["Hover band"]; ctx.fillRect(hover * bw, 0, bw, H);

  // grid + scale
  ctx.strokeStyle = C["Grid lines"]; ctx.lineWidth = 1; ctx.fillStyle = C["Scale text"];
  ctx.font = "11px -apple-system, sans-serif"; ctx.textBaseline = "middle";
  const raw = (hi - lo) / 8, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);
  for (let p = Math.ceil(lo / step) * step; p < hi; p += step) {
    const y = Math.round(Y(p)) + .5; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(plotW, y); ctx.stroke();
    ctx.fillText(p.toFixed(step < 1 ? 2 : 0), plotW + 6, y);
  }
  for (let i = 0; i < SHOW; i += 21) { const x = Math.round(X(i)) + .5; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H - 20); ctx.stroke();
    ctx.fillText(`D${i + 1}`, x - 8, H - 10); }
  ctx.beginPath(); ctx.moveTo(0, priceH + .5); ctx.lineTo(W, priceH + .5); ctx.moveTo(plotW + .5, 0); ctx.lineTo(plotW + .5, H); ctx.stroke();

  // volume
  view.forEach((b, i) => { ctx.fillStyle = b.c >= b.o ? C["Volume up"] : C["Volume down"];
    ctx.fillRect(i * bw + 1, VY(b.v), Math.max(1, bw - 2), volTop + volH - VY(b.v)); });

  // moving averages + RS line
  const line = (key, col, y, w) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); let started = false;
    view.forEach((b, i) => { if (b[key] == null) return; const yy = y(b[key]); started ? ctx.lineTo(X(i), yy) : ctx.moveTo(X(i), yy); started = true; }); ctx.stroke(); };
  for (const [name] of MAS) line(name, C[name], Y, 1.5);
  line("rs", C["RS line"], RY, 1.5);

  // candles: flat, wick and border same color as body
  view.forEach((b, i) => {
    const col = b.c >= b.o ? UP : DOWN, x = Math.round(X(i)) + .5;
    ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, Y(b.h)); ctx.lineTo(x, Y(b.l)); ctx.stroke();
    const top = Y(Math.max(b.o, b.c)), h = Math.max(1, Math.abs(Y(b.o) - Y(b.c)));
    ctx.fillRect(Math.round(i * bw + 1), top, Math.max(1, Math.round(bw - 2)), h);
  });

  // crosshair
  ctx.strokeStyle = C["Crosshair"]; ctx.setLineDash([4, 3]); ctx.beginPath();
  const cx = Math.round(X(hover)) + .5; ctx.moveTo(cx, 0); ctx.lineTo(cx, H - 20);
  const cy = Math.round(Y(view[hover].c)) + .5; ctx.moveTo(0, cy); ctx.lineTo(plotW, cy); ctx.stroke(); ctx.setLineDash([]);

  // MA legend top-left
  ctx.textBaseline = "top"; let lx = 8;
  for (const [name] of [...MAS, ["RS line"]]) { ctx.fillStyle = C[name]; ctx.fillText(name, lx, 8); lx += ctx.measureText(name).width + 14; }
  renderData();
}
cv.addEventListener("mousemove", e => { const rc = cv.getBoundingClientRect();
  hover = Math.min(SHOW - 1, Math.max(0, Math.floor((e.clientX - rc.left) / ((rc.width - 60) / SHOW)))); draw(); });
addEventListener("resize", draw);

// Side panels (surface the state on every hover)
const f = n => n == null ? "-" : n.toFixed(2);
function renderData() {
  const b = view[hover], prev = view[hover - 1] ?? b, chg = (b.c - prev.c) / prev.c * 100;
  document.getElementById("data").innerHTML = [
    ["Bar", `D${hover + 1}`], ["Open", f(b.o)], ["High", f(b.h)], ["Low", f(b.l)],
    [`Close`, `<span class="${chg >= 0 ? "up" : "down"}">${f(b.c)} ${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</span>`],
    ["Volume", (b.v / 1e6).toFixed(2) + "M"], ...MAS.map(([n]) => [n, f(b[n])]), ["RS", b.rs.toFixed(3)],
  ].map(([k, v]) => `<tr><td>${k}</td><td class="num">${v}</td></tr>`).join("");
}
document.getElementById("pal").innerHTML = P.map(([k, v, role]) =>
  `<tr><td><span class="swatch" style="background:${v}"></span> ${k}</td><td>${v}</td><td style="color:#808080">${role}</td></tr>`).join("");
const wl = [["NVDA", 1.84], ["AAPL", -0.42], ["MSFT", 0.31], ["META", 2.10], ["AMZN", -1.05], ["TSLA", -3.22], ["AVGO", 0.97], ["PLTR", 4.41], ["CRWD", 1.12], ["ANET", -0.66]];
document.getElementById("wl").innerHTML = wl.map(([s, c], i) =>
  `<tr class="${i ? "" : "sel"}"><td>${s}</td><td class="num ${c >= 0 ? "up" : "down"}">${c >= 0 ? "+" : ""}${c.toFixed(2)}%</td></tr>`).join("");

// Variant switcher
const VARIANTS = [["stock", "Stock Deepvue UI (chart settings only)"], ["frame", "Full Vintage Frame (whole-app CSS, later)"]];
function setVariant(k) {
  const i = Math.max(0, VARIANTS.findIndex(v => v[0] === k)), [key, name] = VARIANTS[i];
  document.body.className = key; document.getElementById("label").textContent = `${key} (${name})`;
  const u = new URL(location); u.searchParams.set("variant", key); history.replaceState(null, "", u);
  requestAnimationFrame(draw);
}
const cycle = d => { const i = VARIANTS.findIndex(v => v[0] === document.body.className); setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0]); };
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
addEventListener("keydown", e => { if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); });
setVariant(new URLSearchParams(location.search).get("variant") ?? "stock");
</script>
</body>
</html>
